name: Build FlammoSMP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/flammosmp/app
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FlammoSMP"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.flammosmp.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.flammosmp.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '26.60'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.ACCESS_LOCAL_NETWORK"/>
              <application
                  android:label="FlammoSMP"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ProxyService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7A1F2B" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#8B5A2B" android:pathData="M30,46 L54,58 L54,84 L30,72 Z"/>
              <path android:fillColor="#6B4423" android:pathData="M54,58 L78,46 L78,72 L54,84 Z"/>
              <path android:fillColor="#4E9B3A" android:pathData="M30,46 L54,58 L54,65 L30,53 Z"/>
              <path android:fillColor="#3B7A2C" android:pathData="M54,58 L78,46 L78,53 L54,65 Z"/>
              <path android:fillColor="#6CC24A" android:pathData="M54,34 L78,46 L54,58 L30,46 Z"/>
              <path android:fillColor="#FF8A00" android:pathData="M54,12 C60,22 66,27 63,36 C61,42 47,42 45,36 C43,29 50,25 54,12 Z"/>
              <path android:fillColor="#FFD54A" android:pathData="M54,24 C57,29 59,32 57.5,36 C56,39 52,39 50.5,36 C49.5,32 52,29 54,24 Z"/>
          </vector>
          EOF

          cat > app/src/main/java/com/flammosmp/app/ProxyService.kt <<'EOF'
          package com.flammosmp.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.SystemClock
          import android.util.Base64
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.DataOutputStream
          import java.io.EOFException
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.nio.ByteBuffer
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          class JavaInfo(val online: Int, val max: Int, val motd: String, val icon: Bitmap?, val ping: Long)

          /**
           * 1) Fragt den Server live ab (Java Status-Ping per TCP: Icon, Spieler, MOTD;
           *    Bedrock RakNet-Ping per UDP: Ping + Version).
           * 2) Meldet im WLAN eine LAN-Welt an (UDP 19132) und leitet alle Pakete der
           *    Konsole an den Bedrock-Port des Servers weiter.
           */
          class ProxyService : Service() {

              companion object {
                  const val LAN_PORT = 19132

                  val MAGIC = byteArrayOf(0, -1, -1, 0, -2, -2, -2, -2, -3, -3, -3, -3, 0x12, 0x34, 0x56, 0x78)

                  @Volatile var host = ""
                  @Volatile var javaPort = 25565
                  @Volatile var bedrockPort = 19132

                  @Volatile var running = false
                  @Volatile var turbo = false
                  @Volatile var polled = false
                  @Volatile var reachable = false
                  @Volatile var javaOk = false
                  @Volatile var players = -1
                  @Volatile var maxPlayers = -1
                  @Volatile var pingMs = -1L
                  @Volatile var startTime = 0L
                  @Volatile var lastConsole = 0L
                  @Volatile var motd = ""
                  @Volatile var favicon: Bitmap? = null
                  @Volatile var error = ""
                  @Volatile var instance: ProxyService? = null

                  fun buildPing(): ByteArray {
                      val b = ByteBuffer.allocate(33)
                      b.put(1.toByte())
                      b.putLong(System.currentTimeMillis())
                      b.put(MAGIC)
                      b.putLong(0x464C414D4D4FL)
                      return b.array()
                  }

                  /** Bedrock (RakNet) Ping an den echten Server. */
                  fun exchange(req: ByteArray): Pair<ByteArray, Long>? {
                      return try {
                          val s = DatagramSocket()
                          try {
                              s.soTimeout = 1500
                              val addr = InetSocketAddress(host, bedrockPort)
                              if (addr.isUnresolved) return null
                              val t0 = System.nanoTime()
                              s.send(DatagramPacket(req, req.size, addr))
                              val buf = ByteArray(1500)
                              val r = DatagramPacket(buf, buf.size)
                              s.receive(r)
                              Pair(buf.copyOf(r.length), (System.nanoTime() - t0) / 1_000_000)
                          } finally {
                              s.close()
                          }
                      } catch (e: Exception) {
                          null
                      }
                  }

                  fun parsePong(d: ByteArray) {
                      if (d.size < 35 || d[0].toInt() != 0x1c) return
                      val len = ((d[33].toInt() and 0xFF) shl 8) or (d[34].toInt() and 0xFF)
                      val str = String(d, 35, minOf(len, d.size - 35), Charsets.UTF_8)
                      val p = str.split(";")
                      if (!javaOk && p.size > 5) {
                          players = p[4].toIntOrNull() ?: players
                          maxPlayers = p[5].toIntOrNull() ?: maxPlayers
                          if (motd.isBlank()) motd = p[1].replace(Regex("§."), "")
                      }
                  }

                  private fun writeVarInt(o: OutputStream, v: Int) {
                      var x = v
                      while (true) {
                          if ((x and 0x7F.inv()) == 0) { o.write(x); return }
                          o.write((x and 0x7F) or 0x80)
                          x = x ushr 7
                      }
                  }

                  private fun readVarInt(i: InputStream): Int {
                      var n = 0
                      var shift = 0
                      while (true) {
                          val b = i.read()
                          if (b < 0) throw EOFException()
                          n = n or ((b and 0x7F) shl shift)
                          if ((b and 0x80) == 0) return n
                          shift += 7
                          if (shift > 35) throw RuntimeException("VarInt")
                      }
                  }

                  private fun sendPacket(o: OutputStream, body: ByteArray) {
                      val b = ByteArrayOutputStream()
                      writeVarInt(b, body.size)
                      b.write(body)
                      o.write(b.toByteArray())
                      o.flush()
                  }

                  private fun plain(o: Any?): String {
                      return when (o) {
                          is String -> o
                          is JSONObject -> {
                              val sb = StringBuilder(o.optString("text", ""))
                              val ex = o.optJSONArray("extra")
                              if (ex != null) for (i in 0 until ex.length()) sb.append(plain(ex.opt(i)))
                              sb.toString()
                          }
                          else -> ""
                      }
                  }

                  /** Java Server-List-Ping (TCP): Spielerzahl, MOTD, Server-Icon, Ping. */
                  fun javaStatus(): JavaInfo? {
                      return try {
                          val s = Socket()
                          try {
                              s.connect(InetSocketAddress(host, javaPort), 3000)
                              s.soTimeout = 3000
                              val out = s.getOutputStream()
                              val inp = s.getInputStream()

                              val hs = ByteArrayOutputStream()
                              writeVarInt(hs, 0)
                              writeVarInt(hs, -1)
                              val hb = host.toByteArray(Charsets.UTF_8)
                              writeVarInt(hs, hb.size)
                              hs.write(hb)
                              hs.write(javaPort shr 8)
                              hs.write(javaPort and 0xFF)
                              writeVarInt(hs, 1)
                              sendPacket(out, hs.toByteArray())
                              sendPacket(out, byteArrayOf(0))

                              readVarInt(inp)
                              readVarInt(inp)
                              val len = readVarInt(inp)
                              val buf = ByteArray(len)
                              var off = 0
                              while (off < len) {
                                  val r = inp.read(buf, off, len - off)
                                  if (r < 0) throw EOFException()
                                  off += r
                              }
                              val json = JSONObject(String(buf, Charsets.UTF_8))

                              val t0 = System.nanoTime()
                              val pb = ByteArrayOutputStream()
                              writeVarInt(pb, 1)
                              DataOutputStream(pb).writeLong(t0)
                              sendPacket(out, pb.toByteArray())
                              var ping = -1L
                              try {
                                  readVarInt(inp)
                                  readVarInt(inp)
                                  ping = (System.nanoTime() - t0) / 1_000_000
                              } catch (e: Exception) { }

                              val pl = json.optJSONObject("players")
                              val motdText = plain(json.opt("description"))
                                  .replace(Regex("§."), "")
                                  .replace("\n", " | ")
                                  .trim()
                              var icon: Bitmap? = null
                              val fav = json.optString("favicon", "")
                              if (fav.startsWith("data:image") && fav.contains(",")) {
                                  val bytes = Base64.decode(fav.substringAfter(","), Base64.DEFAULT)
                                  icon = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                              }
                              JavaInfo(pl?.optInt("online", -1) ?: -1, pl?.optInt("max", -1) ?: -1, motdText, icon, ping)
                          } finally {
                              s.close()
                          }
                      } catch (e: Exception) {
                          null
                      }
                  }
              }

              private var sock: DatagramSocket? = null
              private val sessions = ConcurrentHashMap<String, DatagramSocket>()
              private val pool = Executors.newCachedThreadPool()
              private var mcLock: WifiManager.MulticastLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private var wake: PowerManager.WakeLock? = null
              @Volatile private var remote: InetSocketAddress? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      shutdown()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startFg()
                  if (running) return START_NOT_STICKY
                  running = true
                  error = ""
                  instance = this
                  remote = null
                  polled = false
                  reachable = false
                  javaOk = false
                  players = -1
                  maxPlayers = -1
                  pingMs = -1
                  motd = ""
                  favicon = null
                  startTime = SystemClock.elapsedRealtime()
                  lastConsole = 0

                  val wm = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                  mcLock = wm.createMulticastLock("flammo:mc").apply { setReferenceCounted(false); acquire() }
                  wake = (getSystemService(POWER_SERVICE) as PowerManager)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "flammo:proxy").apply { acquire() }
                  applyTurbo()

                  pool.execute { loop() }
                  pool.execute { poll() }
                  return START_NOT_STICKY
              }

              /** Live-Daten alle 3 Sekunden vom Server holen. */
              private fun poll() {
                  try {
                      while (running) {
                          val j = javaStatus()
                          val b = exchange(buildPing())
                          javaOk = j != null
                          if (b != null) { pingMs = b.second; parsePong(b.first) }
                          if (j != null) {
                              if (j.online >= 0) players = j.online
                              if (j.max >= 0) maxPlayers = j.max
                              if (j.motd.isNotBlank()) motd = j.motd
                              if (j.icon != null) favicon = j.icon
                              if (b == null && j.ping >= 0) pingMs = j.ping
                          }
                          reachable = j != null || b != null
                          polled = true
                          Thread.sleep(3000)
                      }
                  } catch (e: Exception) { }
              }

              @Suppress("DEPRECATION")
              fun applyTurbo() {
                  val wm = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                  if (turbo) {
                      if (wifiLock == null) {
                          val mode = if (Build.VERSION.SDK_INT >= 29) WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                          else WifiManager.WIFI_MODE_FULL_HIGH_PERF
                          wifiLock = wm.createWifiLock(mode, "flammo:turbo")
                      }
                      if (wifiLock?.isHeld == false) wifiLock?.acquire()
                  } else {
                      if (wifiLock?.isHeld == true) wifiLock?.release()
                  }
              }

              private fun loop() {
                  try {
                      val s = DatagramSocket(null)
                      s.reuseAddress = true
                      s.broadcast = true
                      s.bind(InetSocketAddress(LAN_PORT))
                      sock = s
                      val buf = ByteArray(4096)
                      while (running) {
                          val p = DatagramPacket(buf, buf.size)
                          s.receive(p)
                          if (p.length == 0) continue
                          val data = buf.copyOf(p.length)
                          val from = InetSocketAddress(p.address, p.port)
                          val id = data[0].toInt() and 0xFF
                          try {
                              if (id == 0x01 || id == 0x02) pool.execute { ping(s, data, from) }
                              else relay(s, data, from)
                          } catch (e: Exception) { }
                      }
                  } catch (e: Exception) {
                      if (running) error = "Port 19132 belegt oder Netzwerkfehler"
                  }
                  running = false
              }

              /** Konsole sucht LAN-Welten: mit der echten Server-Antwort beantworten. */
              private fun ping(s: DatagramSocket, req: ByteArray, to: InetSocketAddress) {
                  try {
                      val r = exchange(req) ?: return
                      s.send(DatagramPacket(r.first, r.first.size, to))
                  } catch (e: Exception) { }
              }

              private fun relay(s: DatagramSocket, data: ByteArray, from: InetSocketAddress) {
                  lastConsole = SystemClock.elapsedRealtime()
                  val key = from.toString()
                  val up = sessions.getOrPut(key) {
                      val u = DatagramSocket()
                      u.soTimeout = 60000
                      pool.execute {
                          val b = ByteArray(4096)
                          try {
                              while (running) {
                                  val q = DatagramPacket(b, b.size)
                                  u.receive(q)
                                  s.send(DatagramPacket(b, q.length, from))
                              }
                          } catch (e: Exception) { }
                          sessions.remove(key)
                          u.close()
                      }
                      u
                  }
                  val r = remote ?: InetSocketAddress(host, bedrockPort).also { remote = it }
                  up.send(DatagramPacket(data, data.size, r))
              }

              private fun startFg() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("flammo", "FlammoSMP", NotificationManager.IMPORTANCE_LOW)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, "flammo")
                      .setContentTitle("FlammoSMP")
                      .setContentText("LAN-Welt aktiv - oeffne Minecraft auf der PS5")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(1, n)
              }

              private fun shutdown() {
                  running = false
                  instance = null
                  try { sock?.close() } catch (e: Exception) { }
                  sessions.values.forEach { try { it.close() } catch (e: Exception) { } }
                  sessions.clear()
                  if (mcLock?.isHeld == true) mcLock?.release()
                  if (wifiLock?.isHeld == true) wifiLock?.release()
                  if (wake?.isHeld == true) wake?.release()
              }

              override fun onDestroy() {
                  shutdown()
                  pool.shutdownNow()
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/flammosmp/app/MainActivity.kt <<'EOF'
          package com.flammosmp.app

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Outline
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val handler = Handler(Looper.getMainLooper())
              private lateinit var dot: View
              private lateinit var iconIv: ImageView
              private lateinit var statusTv: TextView
              private lateinit var nameTv: TextView
              private lateinit var motdTv: TextView
              private lateinit var infoTv: TextView
              private lateinit var playersTv: TextView
              private lateinit var pingTv: TextView
              private lateinit var uptimeTv: TextView
              private lateinit var connectBtn: Button
              private lateinit var checkTv: TextView
              private lateinit var turboSw: Switch
              private lateinit var ipEt: EditText
              private lateinit var jpEt: EditText
              private lateinit var bpEt: EditText
              private var shownIcon: Bitmap? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun col(s: String) = Color.parseColor(s)

              private fun shape(c: String, r: Int, stroke: String? = null) = GradientDrawable().apply {
                  setColor(col(c)); cornerRadius = dp(r).toFloat()
                  if (stroke != null) setStroke(dp(1), col(stroke))
              }

              private fun tv(t: String, sp: Float, c: String = "#FFFFFF", bold: Boolean = false) =
                  TextView(this).apply {
                      text = t; textSize = sp; setTextColor(col(c))
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private fun lp(w: Int = -1, ht: Int = -2, wt: Float = 0f, top: Int = 0, start: Int = 0) =
                  LinearLayout.LayoutParams(w, ht, wt).apply { topMargin = dp(top); marginStart = dp(start) }

              private fun vbox() = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
              private fun hbox() = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
              }

              private fun card() = vbox().apply {
                  setPadding(dp(18), dp(18), dp(18), dp(18))
                  background = shape("#33FFFFFF", 28, "#44FFFFFF")
              }

              private fun btn(t: String, bg: String) = Button(this).apply {
                  text = t; isAllCaps = false; setTextColor(Color.WHITE)
                  typeface = Typeface.DEFAULT_BOLD; background = shape(bg, 28)
              }

              private fun edit(hintText: String, value: String, number: Boolean) = EditText(this).apply {
                  hint = hintText
                  setText(value)
                  setTextColor(Color.WHITE)
                  setHintTextColor(col("#99FFFFFF"))
                  textSize = 16f
                  setSingleLine()
                  background = shape("#22FFFFFF", 16, "#44FFFFFF")
                  setPadding(dp(14), dp(12), dp(14), dp(12))
                  inputType = if (number) InputType.TYPE_CLASS_NUMBER
                  else InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
              }

              private fun stat(label: String, value: TextView, start: Int): LinearLayout =
                  vbox().apply {
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = shape("#22FFFFFF", 18, "#44FFFFFF")
                      addView(tv(label, 12f, "#BBFFFFFF"))
                      addView(value)
                  }.also { it.layoutParams = lp(0, -2, 1f, 0, start) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val need = needed()
                  if (need.isNotEmpty()) requestPermissions(need, 1)
                  val prefs = getSharedPreferences("flammo", MODE_PRIVATE)

                  val root = vbox().apply { setPadding(dp(20), dp(24), dp(20), dp(28)) }
                  val scroll = ScrollView(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(col("#5A3FC0"), col("#1C7C9E"), col("#7B2A6B"))
                      )
                      isFillViewport = true
                      fitsSystemWindows = true
                      addView(root)
                  }
                  setContentView(scroll)

                  val title = tv("FlammoSMP", 36f, bold = true)
                  title.paint.shader = LinearGradient(
                      0f, 0f, dp(260).toFloat(), 0f,
                      intArrayOf(col("#FF9A1F"), col("#E94FA0"), col("#9B5CFF")), null, Shader.TileMode.CLAMP
                  )
                  root.addView(title)
                  root.addView(tv("Dein Server auf der Konsole – ohne Werbung", 14f, "#DDFFFFFF"))

                  // ---- Server eingeben ----
                  root.addView(tv("SERVER", 12f, "#CCFFFFFF", true).apply { letterSpacing = 0.15f }, lp(top = 20))
                  val cIn = card()
                  root.addView(cIn, lp(top = 8))
                  ipEt = edit("Server-IP oder Domain", prefs.getString("host", "") ?: "", false)
                  cIn.addView(ipEt)
                  val prow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  jpEt = edit("Java-Port", prefs.getString("jp", "25565") ?: "25565", true)
                  bpEt = edit("Bedrock-Port", prefs.getString("bp", "19132") ?: "19132", true)
                  prow.addView(jpEt, lp(0, -2, 1f))
                  prow.addView(bpEt, lp(0, -2, 1f, 0, 10))
                  cIn.addView(prow, lp(top = 10))

                  // ---- Server-Karte ----
                  val c1 = card()
                  root.addView(c1, lp(top = 16))

                  val row = hbox()
                  iconIv = ImageView(this).apply {
                      setImageResource(R.mipmap.ic_launcher)
                      scaleType = ImageView.ScaleType.FIT_XY
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(v: View, o: Outline) {
                              o.setRoundRect(0, 0, v.width, v.height, dp(14).toFloat())
                          }
                      }
                      clipToOutline = true
                  }
                  row.addView(iconIv, lp(dp(64), dp(64)))
                  val info = vbox()
                  val st = hbox()
                  dot = View(this)
                  st.addView(dot, lp(dp(10), dp(10)))
                  statusTv = tv("GETRENNT", 12f, "#CCFFFFFF", true).apply { letterSpacing = 0.15f }
                  st.addView(statusTv, lp(start = 8))
                  info.addView(st)
                  nameTv = tv("FlammoSMP", 22f, bold = true)
                  info.addView(nameTv)
                  row.addView(info, lp(0, -2, 1f, 0, 14))
                  c1.addView(row)

                  motdTv = tv("", 14f, "#CCFFFFFF")
                  c1.addView(motdTv, lp(top = 12))
                  infoTv = tv("", 15f, "#DDFFFFFF")
                  c1.addView(infoTv, lp(top = 8))

                  playersTv = tv("–/–", 20f, bold = true)
                  pingTv = tv("– ms", 20f, bold = true)
                  uptimeTv = tv("00:00:00", 20f, bold = true)
                  val stats = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  stats.addView(stat("Spieler", playersTv, 0))
                  stats.addView(stat("Ping", pingTv, 8))
                  stats.addView(stat("Laufzeit", uptimeTv, 8))
                  c1.addView(stats, lp(top = 16))

                  connectBtn = btn("Verbinden", "#55FF5A5A")
                  c1.addView(connectBtn, lp(top = 16))
                  connectBtn.setOnClickListener { toggle() }

                  // ---- Optimieren ----
                  root.addView(tv("OPTIMIEREN", 12f, "#CCFFFFFF", true).apply { letterSpacing = 0.15f }, lp(top = 24))
                  val c2 = card()
                  root.addView(c2, lp(top = 8))
                  c2.addView(tv("⚡ Turbo & Verbindungs-Check", 18f, bold = true))
                  c2.addView(
                      tv("Die App kann das Spiel auf der Konsole nicht ändern, aber den Weg zum Server verbessern und dir zeigen, was dich ausbremst.", 14f, "#DDFFFFFF"),
                      lp(top = 8)
                  )
                  val trow = hbox()
                  trow.addView(tv("Turbo-Modus (niedrige Latenz)", 16f), lp(0, -2, 1f))
                  turboSw = Switch(this)
                  trow.addView(turboSw)
                  c2.addView(trow, lp(top = 14))
                  turboSw.setOnCheckedChangeListener { _, c ->
                      ProxyService.turbo = c
                      ProxyService.instance?.applyTurbo()
                  }
                  c2.addView(
                      tv("Hält das WLAN im Niedriglatenz-Modus, nutzt große Puffer und höchste Priorität. Am besten bei eingeschaltetem Display.", 13f, "#BBFFFFFF"),
                      lp(top = 6)
                  )
                  checkTv = tv("", 14f, "#FFFFFF")
                  c2.addView(checkTv, lp(top = 10))

                  val brow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val checkBtn = btn("Verbindungs-Check", "#55FFFFFF")
                  val allBtn = btn("Alles optimieren", "#FF2E9BFF")
                  brow.addView(checkBtn, lp(0, -2, 1f))
                  brow.addView(allBtn, lp(0, -2, 1f, 0, 10))
                  c2.addView(brow, lp(top = 14))
                  checkBtn.setOnClickListener { check() }
                  allBtn.setOnClickListener { turboSw.isChecked = true; check() }

                  root.addView(
                      tv("So geht's: 1) Server-IP und Ports eintragen. 2) Handy und PS5 im selben WLAN, „Verbinden“ tippen. 3) Minecraft auf der PS5 öffnen → Freunde → LAN-Spiele.", 13f, "#CCFFFFFF"),
                      lp(top = 20)
                  )
              }

              // Berechtigungen: "Geräte in der Nähe" / lokales Netzwerk + Benachrichtigungen
              private fun needed(): Array<String> {
                  val list = ArrayList<String>()
                  if (Build.VERSION.SDK_INT >= 33) {
                      list.add("android.permission.POST_NOTIFICATIONS")
                      list.add("android.permission.NEARBY_WIFI_DEVICES")
                  }
                  if (Build.VERSION.SDK_INT >= 36) list.add("android.permission.ACCESS_LOCAL_NETWORK")
                  return list.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                      .toTypedArray()
              }

              private fun isWifi(): Boolean {
                  val cm = getSystemService(ConnectivityManager::class.java)
                  val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                  return caps?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
              }

              /** Liest IP + Ports aus den Feldern, speichert sie und gibt sie an den Dienst weiter. */
              private fun applyInputs(): Boolean {
                  val h = ipEt.text.toString().trim()
                  val jp = jpEt.text.toString().trim().toIntOrNull()
                  val bp = bpEt.text.toString().trim().toIntOrNull()
                  if (h.isEmpty() || jp == null || bp == null || jp !in 1..65535 || bp !in 1..65535) {
                      Toast.makeText(this, "Bitte Server-IP, Java-Port und Bedrock-Port eingeben", Toast.LENGTH_LONG).show()
                      return false
                  }
                  getSharedPreferences("flammo", MODE_PRIVATE).edit()
                      .putString("host", h).putString("jp", jp.toString()).putString("bp", bp.toString()).apply()
                  ProxyService.host = h
                  ProxyService.javaPort = jp
                  ProxyService.bedrockPort = bp
                  return true
              }

              private fun toggle() {
                  if (ProxyService.running) {
                      startService(Intent(this, ProxyService::class.java).setAction("STOP"))
                  } else {
                      if (!applyInputs()) return
                      val need = needed().filter { it != "android.permission.POST_NOTIFICATIONS" }
                      if (need.isNotEmpty()) {
                          Toast.makeText(this, "Bitte „Geräte in der Nähe“ / lokales Netzwerk erlauben", Toast.LENGTH_LONG).show()
                          requestPermissions(needed(), 1)
                          return
                      }
                      if (!isWifi()) {
                          Toast.makeText(this, "Bitte zuerst mit dem WLAN verbinden", Toast.LENGTH_LONG).show()
                          startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))
                          return
                      }
                      startForegroundService(Intent(this, ProxyService::class.java))
                  }
                  handler.postDelayed({ refresh() }, 300)
              }

              private fun check() {
                  if (!ProxyService.running && !applyInputs()) return
                  checkTv.text = "Prüfe Verbindung …"
                  Thread {
                      val b = ProxyService.exchange(ProxyService.buildPing())
                      val j = ProxyService.javaStatus()
                      val wm = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                      @Suppress("DEPRECATION") val wi = wm.connectionInfo
                      val sb = StringBuilder()
                      sb.append(if (j != null) "Java (${ProxyService.javaPort}): erreichbar · ${j.ping} ms\n" else "Java (${ProxyService.javaPort}): nicht erreichbar\n")
                      sb.append(if (b != null) "Bedrock (${ProxyService.bedrockPort}): erreichbar · ${b.second} ms\n" else "Bedrock (${ProxyService.bedrockPort}): nicht erreichbar\n")
                      val best = b?.second ?: j?.ping ?: -1L
                      if (best > 80) sb.append("Ping hoch – näher an den Router, 5-GHz-WLAN nutzen\n")
                      sb.append("WLAN: ${wi.rssi} dBm · ${wi.linkSpeed} Mbit/s")
                      runOnUiThread { checkTv.text = sb.toString() }
                  }.start()
              }

              private fun refresh() {
                  val on = ProxyService.running
                  dot.background = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(col(if (on) "#3DDC97" else "#9E9E9E"))
                  }
                  statusTv.text = if (on) "VERBUNDEN" else "GETRENNT"
                  nameTv.text = if (on && ProxyService.host.isNotEmpty()) ProxyService.host else "FlammoSMP"
                  motdTv.text = if (on && ProxyService.motd.isNotBlank()) ProxyService.motd
                  else "Serverdaten erscheinen nach dem Verbinden"

                  ipEt.isEnabled = !on; jpEt.isEnabled = !on; bpEt.isEnabled = !on

                  val f = ProxyService.favicon
                  if (on && f != null) {
                      if (f !== shownIcon) { iconIv.setImageBitmap(f); shownIcon = f }
                  } else if (shownIcon != null) {
                      iconIv.setImageResource(R.mipmap.ic_launcher); shownIcon = null
                  }

                  val now = SystemClock.elapsedRealtime()
                  infoTv.text = when {
                      ProxyService.error.isNotEmpty() -> ProxyService.error
                      !on -> "Nicht aktiv – Server eintragen und „Verbinden“ tippen"
                      !ProxyService.polled -> "Rufe Serverdaten ab …"
                      !ProxyService.reachable -> "Server nicht erreichbar – IP und Ports prüfen"
                      ProxyService.lastConsole > 0 && now - ProxyService.lastConsole < 30000 -> "Konsole verbunden – viel Spaß!"
                      else -> "Wartet auf die Konsole · PlayStation: Freunde → LAN-Spiele"
                  }
                  val up = if (on) (now - ProxyService.startTime) / 1000 else 0
                  uptimeTv.text = String.format("%02d:%02d:%02d", up / 3600, up % 3600 / 60, up % 60)
                  playersTv.text = if (on && ProxyService.players >= 0) {
                      if (ProxyService.maxPlayers >= 0) "${ProxyService.players}/${ProxyService.maxPlayers}" else "${ProxyService.players}"
                  } else "–/–"
                  pingTv.text = if (on && ProxyService.pingMs >= 0) "${ProxyService.pingMs} ms" else "– ms"
                  connectBtn.text = if (on) "Trennen" else "Verbinden"
              }

              private val tick = object : Runnable {
                  override fun run() { refresh(); handler.postDelayed(this, 1000) }
              }

              override fun onResume() { super.onResume(); turboSw.isChecked = ProxyService.turbo; handler.post(tick) }
              override fun onPause() { super.onPause(); handler.removeCallbacks(tick) }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FlammoSMP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
