name: Build FunkApp APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt (Code) erzeugen
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/funkapp app/src/main/res/values app/src/main/res/layout

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FunkApp"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.funkapp"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.funkapp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              // Audio-Transport fuer den Live-Anruf. Reine Client-Bibliothek -
              // du brauchst zusaetzlich einen eigenen Signaling-Server (siehe Hinweis unten),
              // sonst finden sich die zwei Geraete nicht.
              implementation("io.getstream:stream-webrtc-android:1.1.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <application
                  android:allowBackup="true"
                  android:label="FunkApp"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false" android:label="Einstellungen" />
                  <activity android:name=".CallActivity" android:exported="false" android:label="Anruf" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/java/com/example/funkapp/ContactStore.kt <<'EOF'
          package com.example.funkapp

          import android.content.Context

          class ContactStore(context: Context) {
              private val prefs = context.getSharedPreferences("contacts", Context.MODE_PRIVATE)
              fun save(number: String, name: String) { prefs.edit().putString(number, name).apply() }
              fun all(): Map<String, String> = prefs.all.entries.associate { it.key to (it.value as? String ?: "") }
              fun exists(number: String): Boolean = prefs.contains(number)
              fun remove(number: String) { prefs.edit().remove(number).apply() }
          }
          EOF

          # Opt-in Schalter fuer Lautlos-Bypass: gehoert dem Geraetebesitzer.
          # Niemand sonst kann ihn setzen oder aus der Ferne aktivieren.
          cat > app/src/main/java/com/example/funkapp/PriorityAlertSettings.kt <<'EOF'
          package com.example.funkapp

          import android.content.Context

          class PriorityAlertSettings(context: Context) {
              private val prefs = context.getSharedPreferences("priority_settings", Context.MODE_PRIVATE)

              var enabled: Boolean
                  get() = prefs.getBoolean("enabled", false)
                  set(v) = prefs.edit().putBoolean("enabled", v).apply()

              fun enableForMinutes(minutes: Int) {
                  val now = System.currentTimeMillis()
                  prefs.edit()
                      .putBoolean("enabled", true)
                      .putLong("window_end", now + minutes * 60_000L)
                      .apply()
              }

              fun isCurrentlyActive(): Boolean {
                  if (!enabled) return false
                  val end = prefs.getLong("window_end", Long.MAX_VALUE)
                  if (System.currentTimeMillis() > end) { enabled = false; return false }
                  return true
              }

              fun disable() { enabled = false }
          }
          EOF

          cat > app/src/main/java/com/example/funkapp/AlertNotifier.kt <<'EOF'
          package com.example.funkapp

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import androidx.core.app.NotificationCompat

          object AlertNotifier {
              private const val CHANNEL_ID = "funkapp_priority"

              fun createChannel(context: Context) {
                  val m = context.getSystemService(NotificationManager::class.java)
                  m.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "Durchsagen", NotificationManager.IMPORTANCE_HIGH)
                  )
              }

              // bypassAllowed kommt IMMER vom Empfaenger-Geraet selbst (PriorityAlertSettings),
              // nie vom Anrufer.
              fun showIncoming(context: Context, fromName: String) {
                  val bypassAllowed = PriorityAlertSettings(context).isCurrentlyActive()
                  val b = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("Eingehender Anruf: $fromName")
                      .setPriority(if (bypassAllowed) NotificationCompat.PRIORITY_HIGH else NotificationCompat.PRIORITY_DEFAULT)
                  context.getSystemService(NotificationManager::class.java).notify(fromName.hashCode(), b.build())
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_settings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Durchsagen bei Lautlos erlauben" android:textSize="18sp" />
              <Switch android:id="@+id/switchPriority" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:layout_marginTop="12dp" />
              <Button android:id="@+id/button10min" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:layout_marginTop="24dp"
                  android:text="Heute einmalig fuer 10 Minuten freischalten" />
              <TextView android:id="@+id/statusText" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:layout_marginTop="24dp" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/example/funkapp/SettingsActivity.kt <<'EOF'
          package com.example.funkapp

          import android.os.Bundle
          import android.widget.Button
          import android.widget.Switch
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class SettingsActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)
                  val settings = PriorityAlertSettings(this)
                  val sw = findViewById<Switch>(R.id.switchPriority)
                  val btn = findViewById<Button>(R.id.button10min)
                  val status = findViewById<TextView>(R.id.statusText)

                  fun refresh() {
                      status.text = if (settings.isCurrentlyActive()) "Aktiv" else "Inaktiv"
                      sw.isChecked = settings.enabled
                  }
                  sw.setOnCheckedChangeListener { _, checked -> if (checked) settings.enabled = true else settings.disable(); refresh() }
                  btn.setOnClickListener { settings.enableForMinutes(10); refresh() }
                  refresh()
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="24dp">
              <EditText android:id="@+id/numberInput" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:hint="Nummer" android:inputType="number" />
              <EditText android:id="@+id/nameInput" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:hint="Name (optional)" android:layout_marginTop="8dp" />
              <Button android:id="@+id/saveButton" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:text="Speichern" android:layout_marginTop="12dp" />
              <Button android:id="@+id/callButton" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:text="Anrufen" android:layout_marginTop="8dp" />
              <Button android:id="@+id/settingsButton" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:text="Einstellungen" android:layout_marginTop="8dp" />
              <TextView android:id="@+id/resultText" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:layout_marginTop="16dp" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/example/funkapp/MainActivity.kt <<'EOF'
          package com.example.funkapp

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  AlertNotifier.createChannel(this)
                  val store = ContactStore(this)
                  val numberInput = findViewById<EditText>(R.id.numberInput)
                  val nameInput = findViewById<EditText>(R.id.nameInput)
                  val resultText = findViewById<TextView>(R.id.resultText)

                  findViewById<Button>(R.id.saveButton).setOnClickListener {
                      val number = numberInput.text.toString().trim()
                      if (number.isEmpty()) { Toast.makeText(this, "Nummer eingeben", Toast.LENGTH_SHORT).show(); return@setOnClickListener }
                      store.save(number, nameInput.text.toString().trim().ifEmpty { number })
                      resultText.text = "Gespeichert: $number"
                  }

                  findViewById<Button>(R.id.callButton).setOnClickListener {
                      val number = numberInput.text.toString().trim()
                      if (!store.exists(number)) { resultText.text = "Nummer nicht gespeichert."; return@setOnClickListener }
                      val name = store.all()[number] ?: number
                      val i = Intent(this, CallActivity::class.java)
                      i.putExtra("peerName", name)
                      i.putExtra("peerNumber", number)
                      startActivity(i)
                  }

                  findViewById<Button>(R.id.settingsButton).setOnClickListener {
                      startActivity(Intent(this, SettingsActivity::class.java))
                  }
              }
          }
          EOF

          # Anruf-Bildschirm: WebRTC-Audio-Geruest + Opt-in-Pruefung.
          # Nur die Client-Seite. Fuer eine echte Verbindung zwischen zwei
          # Geraeten braucht es zusaetzlich einen Signaling-Server (WebSocket),
          # ueber den beide Seiten ihre Verbindungsdaten austauschen - den
          # musst du selbst betreiben und unten eintragen. Ohne ihn kompiliert
          # die App, baut aber keine echte Verbindung auf.
          cat > app/src/main/java/com/example/funkapp/CallActivity.kt <<'EOF'
          package com.example.funkapp

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          private const val SIGNALING_URL = "wss://DEIN-EIGENER-SIGNALING-SERVER"

          class CallActivity : AppCompatActivity() {

              private val micPermission = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted -> if (granted) startCall() else finish() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val status = TextView(this)
                  setContentView(status)

                  val peerName = intent.getStringExtra("peerName") ?: "?"
                  val peerNumber = intent.getStringExtra("peerNumber") ?: ""

                  // Ob diese Benachrichtigung den Lautlos-Modus durchbricht,
                  // entscheidet AUSSCHLIESSLICH die Opt-in-Einstellung auf dem
                  // Empfaenger-Geraet (SettingsActivity), niemals diese Activity.
                  AlertNotifier.showIncoming(this, peerName)
                  status.text = "Verbinde mit $peerName ($peerNumber) ueber $SIGNALING_URL ..."

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      == PackageManager.PERMISSION_GRANTED
                  ) {
                      startCall()
                  } else {
                      micPermission.launch(Manifest.permission.RECORD_AUDIO)
                  }
              }

              private fun startCall() {
                  // Hier wuerde die WebRTC-PeerConnection aufgebaut: Angebot/Antwort
                  // (SDP) und ICE-Kandidaten ueber SIGNALING_URL austauschen, danach
                  // lokalen Audio-Track hinzufuegen. Dieser Teil setzt einen
                  // laufenden Signaling-Server voraus und steht deshalb nur als
                  // Geruest hier - die stream-webrtc-android Bibliothek ist bereits
                  // eingebunden (siehe app/build.gradle.kts).
              }
          }
          EOF

          echo "Projekt erzeugt:"
          find app -type f | sort

      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FunkApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
